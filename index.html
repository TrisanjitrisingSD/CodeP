<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeP — Playground</title>
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+CiAgPHJlY3QgeD0iMSIgeT0iMSIgd2lkdGg9IjYyIiBoZWlnaHQ9IjYyIiByeD0iMTUiIGZpbGw9IiMwQjBFMTQiIHN0cm9rZT0iIzJBMzI0NyIgc3Ryb2tlLXdpZHRoPSIxLjUiLz4KICA8cGF0aCBmaWxsPSIjRkZCNDU0IiBmaWxsLXJ1bGU9ImV2ZW5vZGQiIGQ9IgogICAgTTE5IDE1CiAgICBMMTkgNTEKICAgIEwyNyA1MQogICAgTDI3IDM1CiAgICBMMzYgMzUKICAgIEM0NSAzNSA0NSAxNSAzNiAxNQogICAgTDE5IDE1CiAgICBaCiAgICBNMjcgMjIKICAgIEwzNiAyMgogICAgQzQwIDIyIDQwIDI4IDM2IDI4CiAgICBMMjcgMjgKICAgIEwyNyAyMgogICAgWgogICIvPgogIDxjaXJjbGUgY3g9IjQ2IiBjeT0iNDciIHI9IjMuNCIgZmlsbD0iIzZFRTdCNyIvPgo8L3N2Zz4K">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #0B0E14;
      --panel: #10141C;
      --panel-2: #141924;
      --border: #232A3A;
      --border-soft: #1B2130;
      --text: #E7EAF0;
      --text-dim: #8A93A8;
      --text-faint: #565F76;
      --amber: #FFB454;
      --amber-dim: #7A5A26;
      --mint: #6EE7B7;
      --red: #FF6B6B;
      --red-dim: #4A2626;
      --radius: 10px;
      --mono: 'JetBrains Mono', ui-monospace, monospace;
      --display: 'Space Grotesk', sans-serif;
      --body: 'Inter', sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--body);
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-image:
        radial-gradient(circle at 15% 0%, rgba(255, 180, 84, 0.05), transparent 40%),
        radial-gradient(circle at 85% 100%, rgba(110, 231, 183, 0.04), transparent 45%);
    }

    ::selection {
      background: rgba(255, 180, 84, 0.25);
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 1440px;
      margin: 0 auto;
      padding: 18px 22px 22px;
    }

    /* ---------- Top bar ---------- */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 16px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .brand .mark {
      font-family: var(--display);
      font-weight: 700;
      font-size: 22px;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .brand .mark span {
      color: var(--amber);
    }

    .brand .tagline {
      font-size: 12.5px;
      color: var(--text-faint);
      font-family: var(--mono);
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    button {
      font-family: var(--body);
      cursor: pointer;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      padding: 9px 14px;
      transition: border-color .15s ease, background .15s ease, transform .1s ease;
    }

    button:hover {
      border-color: #3A4256;
      background: #171D2A;
    }

    button:active {
      transform: translateY(1px);
    }

    button:focus-visible {
      outline: 2px solid var(--amber);
      outline-offset: 2px;
    }

    .btn-run {
      background: var(--amber);
      border-color: var(--amber);
      color: #241804;
      font-weight: 600;
      padding: 9px 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-run:hover {
      background: #ffc678;
      border-color: #ffc678;
    }

    .btn-run:disabled {
      opacity: .55;
      cursor: default;
      transform: none;
    }

    .btn-run kbd {
      font-family: var(--mono);
      font-size: 10.5px;
      background: rgba(0, 0, 0, 0.18);
      padding: 2px 5px;
      border-radius: 4px;
    }

    /* ---------- Pipeline indicator (signature element) ---------- */
    .pipeline {
      display: flex;
      align-items: center;
      gap: 0;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.04em;
    }

    .stage {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 12px;
      border: 1px solid var(--border);
      color: var(--text-faint);
      background: var(--panel-2);
      position: relative;
    }

    .stage:first-child {
      border-radius: 8px 0 0 8px;
    }

    .stage:last-child {
      border-radius: 0 8px 8px 0;
    }

    .stage:not(:first-child) {
      border-left: none;
    }

    .stage .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-faint);
      transition: background .2s ease, box-shadow .2s ease;
    }

    .stage.active {
      color: var(--amber);
    }

    .stage.active .dot {
      background: var(--amber);
      box-shadow: 0 0 0 3px rgba(255, 180, 84, 0.18);
      animation: pulse 0.9s ease-in-out infinite;
    }

    .stage.done {
      color: var(--mint);
    }

    .stage.done .dot {
      background: var(--mint);
      box-shadow: none;
      animation: none;
    }

    .stage.error {
      color: var(--red);
    }

    .stage.error .dot {
      background: var(--red);
      box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.2);
      animation: none;
    }

    @keyframes pulse {

      0%,
      100% {
        box-shadow: 0 0 0 3px rgba(255, 180, 84, 0.18);
      }

      50% {
        box-shadow: 0 0 0 6px rgba(255, 180, 84, 0.05);
      }
    }

    /* ---------- Main layout ---------- */
    .layout {
      flex: 1;
      display: grid;
      grid-template-columns: 190px 1fr 1fr;
      gap: 14px;
      min-height: 0;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    .panel-head {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-soft);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-faint);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* ---------- Sidebar / examples ---------- */
    .sidebar .panel-head {
      border-bottom: 1px solid var(--border-soft);
    }

    .examples {
      display: flex;
      flex-direction: column;
      padding: 8px;
      gap: 3px;
      overflow-y: auto;
    }

    .example-btn {
      text-align: left;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-dim);
      font-size: 12.5px;
      padding: 9px 10px;
      border-radius: 7px;
    }

    .example-btn:hover {
      background: var(--panel-2);
      color: var(--text);
      border-color: var(--border-soft);
    }

    .example-btn.active {
      background: rgba(255, 180, 84, 0.08);
      color: var(--amber);
      border-color: var(--amber-dim);
    }

    .example-btn .ex-desc {
      display: block;
      font-family: var(--mono);
      font-size: 10.5px;
      color: var(--text-faint);
      margin-top: 2px;
    }

    .sidebar-foot {
      margin-top: auto;
      padding: 12px 14px;
      border-top: 1px solid var(--border-soft);
      font-family: var(--mono);
      font-size: 10.5px;
      color: var(--text-faint);
      line-height: 1.6;
    }

    .sidebar-foot b {
      color: var(--text-dim);
    }

    /* ---------- Editor ---------- */
    .editor-wrap {
      flex: 1;
      display: flex;
      min-height: 0;
    }

    .gutter {
      font-family: var(--mono);
      font-size: 13px;
      line-height: 21px;
      color: #3D4459;
      text-align: right;
      padding: 14px 10px 14px 0;
      user-select: none;
      overflow: hidden;
      background: var(--panel);
      min-width: 38px;
      white-space: pre;
    }

    #editor {
      flex: 1;
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      line-height: 21px;
      padding: 14px 14px 14px 6px;
      tab-size: 4;
      white-space: pre;
    }

    /* ---------- Output ---------- */
    .tabs {
      display: flex;
      gap: 2px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      border-radius: 6px;
      color: var(--text-faint);
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 4px 9px;
    }

    .tab-btn:hover {
      color: var(--text-dim);
    }

    .tab-btn.active {
      background: var(--panel-2);
      color: var(--amber);
    }

    .output-body {
      flex: 1;
      overflow: auto;
      padding: 14px;
      font-family: var(--mono);
      font-size: 12.5px;
      line-height: 1.7;
    }

    .out-line {
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--text);
    }

    .empty-state {
      color: var(--text-faint);
      font-family: var(--mono);
      font-size: 12px;
    }

    .error-box {
      border: 1px solid var(--red-dim);
      background: rgba(255, 107, 107, 0.06);
      border-radius: 8px;
      padding: 12px 14px;
      color: #FFB3B3;
    }

    .error-box .err-stage {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--red);
      margin-bottom: 6px;
    }

    .error-box .err-msg {
      font-family: var(--mono);
      font-size: 12.5px;
      color: #FFD4D4;
    }

    pre.code-view {
      margin: 0;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.7;
      color: var(--text-dim);
      white-space: pre-wrap;
      word-break: break-word;
    }

    pre.code-view .k {
      color: var(--amber);
    }

    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #232A3A;
      border-radius: 8px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #2E3750;
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
        grid-auto-rows: auto;
        overflow-y: auto;
      }

      .sidebar {
        order: 1;
        max-height: 160px;
      }

      .examples {
        flex-direction: row;
        flex-wrap: nowrap;
        overflow-x: auto;
      }

      .example-btn {
        min-width: 150px;
      }

      #editor-panel {
        order: 2;
        min-height: 260px;
      }

      #output-panel {
        order: 3;
        min-height: 260px;
      }

      .app {
        height: auto;
        min-height: 100vh;
      }

      .pipeline {
        display: none;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="topbar">
      <div class="brand">
        <div class="mark">Code<span>P</span></div>
        <div class="tagline">tokenizer → parser → interpreter, running live in your browser</div>
      </div>

      <div class="pipeline" id="pipeline">
        <div class="stage" data-stage="tokenize"><span class="dot"></span>tokenize</div>
        <div class="stage" data-stage="parse"><span class="dot"></span>parse</div>
        <div class="stage" data-stage="interpret"><span class="dot"></span>interpret</div>
      </div>

      <div class="topbar-actions">
        <button id="clearBtn">Clear output</button>
        <button id="runBtn" class="btn-run">▶ Run <kbd>Ctrl ⏎</kbd></button>
      </div>
    </div>

    <div class="layout">

      <div class="panel sidebar">
        <div class="panel-head">Examples</div>
        <div class="examples" id="examples"></div>
        <div class="sidebar-foot">
          Keywords: <b>tri</b> · <b>def</b> · <b>if / elif / else</b> · <b>while</b> · <b>do</b> · <b>for</b> ·
          <b>return</b> · <b>write()</b>
        </div>
      </div>

      <div class="panel" id="editor-panel">
        <div class="panel-head">
          <span>main.codep</span>
        </div>
        <div class="editor-wrap">
          <div class="gutter" id="gutter">1</div>
          <textarea id="editor" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
        </div>
      </div>

      <div class="panel" id="output-panel">
        <div class="panel-head">
          <span>Result</span>
          <div class="tabs">
            <button class="tab-btn active" data-tab="output">Output</button>
            <button class="tab-btn" data-tab="ast">AST</button>
            <button class="tab-btn" data-tab="compiled">Compiled JS</button>
          </div>
        </div>
        <div class="output-body" id="outputBody">
          <div class="empty-state">// press Run to execute — output from write() shows up here</div>
        </div>
      </div>

    </div>
  </div>

  <script>
    /* =========================================================================
       CodeP language runtime — Tokenizer, Environment, Parser, Interpreter,
       Generator. Ported as-is from the project source, ES module import/export
       stripped so it runs directly in the browser with no build step.
       ========================================================================= */

    const Spec = [
      [/^\s+/, null],
      [/^\/\/.*/, null],
      [/^\/\*[\s\S]*?\*\//, null],
      [/^;/, ";"],
      [/^{/, "{"],
      [/^}/, "}"],
      [/^\(/, "("],
      [/^\)/, ")"],
      [/^\[/, "["],
      [/^\]/, "]"],
      [/^,/, ","],
      [/^\./, "."],
      [/^\?/, "?"],
      [/^:/, ":"],
      [/^[<>]=?/, "RELATIONAL_OPERATOR"],
      [/^[=!]=/, "EQUALITY_OPERATOR"],
      [/^&&/, "LOGICAL_AND"],
      [/^\|\|/, "LOGICAL_OR"],
      [/^!/, "LOGICAL_NOT"],
      [/^\btri\b/, "let"],
      [/^\bif\b/, "if"],
      [/^\belif\b/, "elif"],
      [/^\belse\b/, "else"],
      [/^\btrue\b/, "true"],
      [/^\bfalse\b/, "false"],
      [/^\bnull\b/, "null"],
      [/^\bclass\b/, "class"],
      [/^\bthis\b/, "this"],
      [/^\bextends\b/, "extends"],
      [/^\bsuper\b/, "super"],
      [/^\bnew\b/, "new"],
      [/^\bmodule\b/, "module"],
      [/^\bimport\b/, "import"],
      [/^\bwhile\b/, "while"],
      [/^\bdo\b/, "do"],
      [/^\bfor\b/, "for"],
      [/^\bdef\b/, "def"],
      [/^\breturn\b/, "return"],
      [/^=/, "SIMPLE_ASSIGN"],
      [/^[\*\\/\+\-]=/, "COMPLEX_ASSIGN"],
      [/^[+\-]/, "ADDITIVE_OPERATOR"],
      [/^[*\/]/, "MULTIPLICATIVE_OPERATOR"],
      [/^%/, "MODULO_OPERATOR"],
      [/^\d+/, "NUMBER"],
      [/^"[^"]*"/, "STRING"],
      [/^'[^']*'/, "STRING"],
      [/^\w+/, "IDENTIFIER"],
    ];

    class Tokenizer {
      init(string) {
        this._string = string;
        this._cursor = 0;
        this._line = 1;
        this._column = 1;
      }
      isEOF() { return this._cursor == this._string.length; }
      hasMoreTokens() { return this._cursor < this._string.length; }
      getNextToken() {
        if (!this.hasMoreTokens()) return null;
        const string = this._string.slice(this._cursor);
        const start = this._getLocation();
        for (const [regexp, tokenType] of Spec) {
          const tokenValue = this._match(regexp, string);
          if (tokenValue == null) continue;
          if (tokenType == null) return this.getNextToken();
          return { type: tokenType, value: tokenValue, loc: { start, end: this._getLocation() } };
        }
        throw new SyntaxError(`Unexpected token: "${string[0]}" at line ${start.line}, column ${start.column}`);
      }
      _match(regexp, string) {
        const matched = regexp.exec(string);
        if (matched == null) return null;
        this._cursor += matched[0].length;
        this._advancePosition(matched[0]);
        return matched[0];
      }
      _advancePosition(value) {
        for (const char of value) {
          if (char === "\n") { this._line += 1; this._column = 1; }
          else { this._column += 1; }
        }
      }
      _getLocation() { return { line: this._line, column: this._column, offset: this._cursor }; }
    }

    class Environment {
      constructor(record = {}, parent = null) { this.record = record; this.parent = parent; }
      define(name, value) { this.record[name] = value; return value; }
      lookup(name) { return this.resolve(name).record[name]; }
      assign(name, value) { this.resolve(name).record[name] = value; return value; }
      resolve(name) {
        if (this.record.hasOwnProperty(name)) return this;
        if (this.parent == null) throw new ReferenceError(`Variable "${name}" is not defined.`);
        return this.parent.resolve(name);
      }
    }

    class Parser {
      constructor() { this._string = ""; this._tokenizer = new Tokenizer(); this._lookahead = null; this._prevToken = null; }
      parse(string) {
        this._string = string;
        this._tokenizer.init(this._string);
        this._lookahead = this._tokenizer.getNextToken();
        this._prevToken = null;
        return this.Program();
      }
      Program() {
        const start = this._lookahead ? this._lookahead : { line: 1, column: 1, offset: 0 };
        const body = this.StatementList();
        return this._node(start, { type: "Program", body }, this._prevToken ?? start);
      }
      StatementList(stopLookAhead = null) {
        const statementList = [];
        if (this._lookahead == null || this._lookahead.type === stopLookAhead) return statementList;
        statementList.push(this.Statement());
        while (this._lookahead != null && this._lookahead.type !== stopLookAhead) statementList.push(this.Statement());
        return statementList;
      }
      Statement() {
        if (this._lookahead == null) throw this._syntaxError("Unexpected end of input", this._prevToken);
        switch (this._lookahead.type) {
          case "{": return this.BlockStatement();
          case ";": return this.EmptyStatement();
          case "let": return this.VariableStatement();
          case "if": return this.IfStatement();
          case "def": return this.FucntionDeclaration();
          case "return": return this.ReturnStatement();
          case "class": return this.ClassDeclaration();
          case "while": case "do": case "for": return this.IterationStatement();
          case "module": return this.ModuleStatement();
          case "import": return this.ImportStatement();
          default: return this.ExpressionStatement();
        }
      }
      ImportStatement() {
        const startToken = this._lookahead; this._eat("import");
        const name = this.Identifier();
        return this._node(startToken, { type: "ImportStatement", name });
      }
      ModuleStatement() {
        const startToken = this._lookahead; this._eat("module");
        const name = this.Identifier();
        const body = this.BlockStatement();
        return this._node(startToken, { type: "ModuleDeclaration", name, body });
      }
      BlockStatement() {
        const startToken = this._lookahead; this._eat("{");
        const body = this._lookahead.type !== "}" ? this.StatementList("}") : [];
        this._eat("}");
        return this._node(startToken, { type: "BlockStatement", body });
      }
      EmptyStatement() {
        const startToken = this._lookahead; this._eat(";");
        return this._node(startToken, { type: "EmptyStatement" });
      }
      VariableStatement() {
        const variableStatement = this.VariableStatementInit();
        this._eat(";");
        return variableStatement;
      }
      VariableStatementInit() {
        const startToken = this._lookahead; this._eat("let");
        const declarations = this.VariableDeclarationList();
        return this._node(startToken, { type: "VariableStatement", declarations });
      }
      VariableDeclarationList() {
        const declarations = [];
        do { declarations.push(this.VariableDeclaration()); } while (this._lookahead.type === "," && this._eat(","));
        return declarations;
      }
      VariableDeclaration() {
        const startToken = this._lookahead;
        const id = this.Identifier();
        const init = this._lookahead.type !== ";" && this._lookahead.type !== "," ? this.VariableInitilizer() : null;
        return this._node(startToken, { type: "VariableDeclaration", id, init });
      }
      VariableInitilizer() { this._eat("SIMPLE_ASSIGN"); return this.AssignmentExpression(); }
      IfStatement() {
        const startToken = this._lookahead; this._eat("if"); this._eat("(");
        const test = this.Expression(); this._eat(")");
        const consequent = this.Statement();
        let alternate = this._lookahead != null ? this._CheckElifOrElseStatement() : null;
        return this._node(startToken, { type: "IfStatement", test, consequent, alternate });
      }
      _CheckElifOrElseStatement() {
        if (this._lookahead == null) return null;
        switch (this._lookahead.type) {
          case "elif": return this.ElifStatement();
          case "else": return this.ElseStatement();
          default: return null;
        }
      }
      ElifStatement() {
        const startToken = this._lookahead; this._eat("elif"); this._eat("(");
        const test = this.Expression(); this._eat(")");
        const consequent = this.Statement();
        let alternate = this._lookahead != null ? this._CheckElifOrElseStatement() : null;
        return this._node(startToken, { type: "IfStatement", test, consequent, alternate });
      }
      ElseStatement() { this._eat("else"); return this.Statement(); }
      IterationStatement() {
        if (this._lookahead == null) return null;
        switch (this._lookahead.type) {
          case "while": return this.WhileStatement();
          case "do": return this.DoWhileStatement();
          case "for": return this.ForStatement();
          default: return null;
        }
      }
      WhileStatement() {
        const startToken = this._lookahead; this._eat("while"); this._eat("(");
        let test = this.Expression(); this._eat(")");
        let body = this.Statement();

      },
      {
        name: "Sum 1 to N",
        desc: "for loop",
        code: `tri n = 10;
tri sum = 0;
for(tri i=1; i<=n; i+=1){
  sum += i;
}
write("Sum:");
write(sum);
`
      },
      {
        name: "Grade checker",
        desc: "elif chain",
        code: `tri marks = 75;

if(marks >= 90){
  write("A grade");
}elif(marks >= 60){
  write("B grade");
}else{
  write("Needs improvement");
}
`
      },
      {
        name: "Countdown",
        desc: "do-while",
        code: `tri i = 5;
do{
  write(i);
  i -= 1;
}while(i > 0);
write("Liftoff!");
`
      },
    ];

    const editor = document.getElementById('editor');
    const gutter = document.getElementById('gutter');
    const runBtn = document.getElementById('runBtn');
    const clearBtn = document.getElementById('clearBtn');
    const outputBody = document.getElementById('outputBody');
    const examplesEl = document.getElementById('examples');
    const tabs = document.querySelectorAll('.tab-btn');

    let lastRun = { logs: [], ast: null, compiled: null, error: null };
    let activeTab = 'output';
    let activeExampleIndex = 0;

    const STORAGE_KEY = 'codep-playground-code';
    const EXAMPLE_STORAGE_KEY = "codep-example-cache";

    let exampleCache = {};

    try {
      exampleCache = JSON.parse(localStorage.getItem(EXAMPLE_STORAGE_KEY)) || {};
    } catch {
      exampleCache = {};
    }

    function saveCode() {
      exampleCache[activeExampleIndex] = editor.value;

      try {
        localStorage.setItem(
          EXAMPLE_STORAGE_KEY,
          JSON.stringify(exampleCache)
        );
      } catch { }
    }

    function renderExamples() {
      examplesEl.innerHTML = '';
      examples.forEach((ex, i) => {
        const btn = document.createElement('button');
        btn.className = 'example-btn' + (i === activeExampleIndex ? ' active' : '');
        btn.innerHTML = `${ex.name}<span class="ex-desc">${ex.desc}</span>`;
        btn.addEventListener("click", () => {

          // Save current example before switching
          saveCode();

          activeExampleIndex = i;

          // Load saved version if it exists
          editor.value = exampleCache[i] ?? ex.code;

          updateGutter();
          renderExamples();
          editor.focus();
        });
        examplesEl.appendChild(btn);
      });
    }
    renderExamples();

    // let savedCode = null;
    // try { savedCode = localStorage.getItem(STORAGE_KEY); } catch (e) { /* storage unavailable, ignore */ }
    // editor.value = savedCode || examples[0].code;
    editor.value = exampleCache[0] ?? examples[0].code;


    function updateGutter() {
      const lines = editor.value.split('\n').length;
      let out = '';
      for (let i = 1; i <= lines; i++) out += i + '\n';
      gutter.textContent = out;
    }
    updateGutter();
    editor.addEventListener('input', () => { updateGutter(); saveCode(); });
    editor.addEventListener('scroll', () => { gutter.scrollTop = editor.scrollTop; });
    editor.addEventListener('keydown', (e) => {
      if (e.key === 'Tab') {
        e.preventDefault();
        const start = editor.selectionStart, end = editor.selectionEnd;
        editor.value = editor.value.slice(0, start) + '    ' + editor.value.slice(end);
        editor.selectionStart = editor.selectionEnd = start + 4;
        updateGutter();
        saveCode();
      }
    });
    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); runCode(); }
    });

    function setStage(stage, state) {
      const el = document.querySelector(`.stage[data-stage="${stage}"]`);
      if (!el) return;
      el.classList.remove('active', 'done', 'error');
      if (state) el.classList.add(state);
    }
    function resetPipeline() { ['tokenize', 'parse', 'interpret'].forEach(s => setStage(s, null)); }
    function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

    function formatValue(v) {
      if (v === null) return 'null';
      if (v === undefined) return 'undefined';
      return String(v);
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function switchTab(tab) {
      activeTab = tab;
      tabs.forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
      render();
    }
    tabs.forEach(t => t.addEventListener('click', () => switchTab(t.dataset.tab)));

    function render() {
      if (lastRun.error) {
        outputBody.innerHTML = `<div class="error-box"><div class="err-stage">${lastRun.error.stage} error</div><div class="err-msg">${escapeHtml(lastRun.error.message)}</div></div>`;
        return;
      }
      if (activeTab === 'output') {
        if (!lastRun.logs.length) {
          outputBody.innerHTML = `<div class="empty-state">// no output — try calling write(...) in your code</div>`;
          return;
        }
        outputBody.innerHTML = lastRun.logs.map((line) =>
          `<div class="out-line">${escapeHtml(line)}</div>`
        ).join('');
      } else if (activeTab === 'ast') {
        outputBody.innerHTML = lastRun.ast
          ? `<pre class="code-view">${escapeHtml(JSON.stringify(lastRun.ast, null, 2))}</pre>`
          : `<div class="empty-state">// run your code to see the AST</div>`;
      } else if (activeTab === 'compiled') {
        outputBody.innerHTML = lastRun.compiled
          ? `<pre class="code-view">${escapeHtml(lastRun.compiled)}</pre>`
          : `<div class="empty-state">// run your code to see the compiled JavaScript</div>`;
      }
    }

    async function runCode() {
      const code = editor.value;
      runBtn.disabled = true;
      resetPipeline();
      lastRun = { logs: [], ast: null, compiled: null, error: null };

      await delay(40);
      setStage('tokenize', 'active');
      await delay(150);
      try {
        const tk = new Tokenizer();
        tk.init(code);
        while (tk.hasMoreTokens()) tk.getNextToken();
      } catch (e) {
        setStage('tokenize', 'error');
        lastRun.error = { stage: 'Tokenizing', message: e.message };
        render(); runBtn.disabled = false; return;
      }
      setStage('tokenize', 'done');

      setStage('parse', 'active');
      await delay(150);
      let ast;
      try {
        const parser = new Parser();
        ast = parser.parse(code);
      } catch (e) {
        setStage('parse', 'error');
        lastRun.error = { stage: 'Parsing', message: e.message };
        render(); runBtn.disabled = false; return;
      }
      setStage('parse', 'done');
      lastRun.ast = ast;
      try { lastRun.compiled = new Generator().generate(ast.body); } catch (e) { lastRun.compiled = `// could not compile: ${e.message}`; }

      setStage('interpret', 'active');
      await delay(150);
      const originalLog = console.log;
      const captured = [];
      console.log = (...args) => { captured.push(args.map(formatValue).join(' ')); };
      try {
        const interpreter = new Interpreter(freshGlobalEnvironment());
        interpreter.interpret(ast.body);
        setStage('interpret', 'done');
      } catch (e) {
        setStage('interpret', 'error');
        lastRun.error = { stage: 'Running', message: e.message };
        console.log = originalLog;
        render(); runBtn.disabled = false; return;
      }
      console.log = originalLog;
      lastRun.logs = captured;
      render();
      runBtn.disabled = false;
    }

    runBtn.addEventListener('click', runCode);
    clearBtn.addEventListener('click', () => {
      lastRun = { logs: [], ast: null, compiled: null, error: null };
      resetPipeline();
      render();
    });

    render();
  </script>
</body>

</html>
